<section class="rounded-2xl border bg-card">
  <div class="border-b p-5">
    <h2 class="font-semibold">Змінити пароль</h2>
  </div>
  <div class="space-y-4 p-5">
    <div class="grid gap-2">
      <label uiLabel for="pw-old">Поточний пароль</label>
      <input
        uiInput
        id="pw-old"
        type="password"
        autocomplete="current-password"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
      />
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <div class="grid gap-2">
        <label uiLabel for="pw-new">Новий пароль</label>
        <input
          uiInput
          id="pw-new"
          type="password"
          autocomplete="new-password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
        />
      </div>
      <div class="grid gap-2">
        <label uiLabel for="pw-rep">Повторіть пароль</label>
        <input
          uiInput
          id="pw-rep"
          type="password"
          autocomplete="new-password"
          [ngModel]="repeatPassword()"
          (ngModelChange)="repeatPassword.set($event)"
        />
      </div>
    </div>
    <button uiButton variant="outline" type="button" (click)="onSubmit()">
      Оновити пароль
    </button>
  </div>
</section>
