<section class="flex flex-wrap items-center gap-5 rounded-2xl border bg-card p-6">
  <ui-avatar
    [initials]="userInitials()"
    [tone]="userAvatarTone()"
    size="default"
    customClass="size-20 text-2xl"
  />
  <div class="min-w-0 flex-1">
    <h2 class="text-xl font-semibold">{{ userFullName() }}</h2>
    <p class="text-sm text-muted-foreground">{{ user().email }}</p>
    <div class="mt-2 flex items-center gap-2 text-sm text-muted-foreground">
      <ui-badge [variant]="user().role">{{ userRoleLabel() }}</ui-badge>
      <span>у групі {{ groupName() }} з {{ user().joinedAt }}</span>
    </div>
  </div>
  <a
    uiButton
    variant="outline"
    routerLink="/login"
    role="button"
    tabindex="0"
  >
    <ui-icon name="log-out" />
    Вийти
  </a>
</section>
