<section aria-labelledby="pending" class="space-y-3">
  <h2 id="pending" class="flex items-center gap-2 text-sm font-semibold text-muted-foreground">
    <ui-icon name="clock" svgClass="size-4" />
    Очікують підтвердження · {{ invitations().length }}
  </h2>
  <ul class="divide-y overflow-hidden rounded-2xl border border-dashed bg-card">
    @for (inv of invitations(); track inv.id) {
      <li class="flex flex-wrap items-center gap-3 p-4">
        <span class="grid size-10 place-items-center rounded-full bg-muted text-muted-foreground">
          <ui-icon name="mail" svgClass="size-4" />
        </span>
        <div class="min-w-0 flex-1">
          <p class="truncate font-medium">{{ inv.email }}</p>
          <p class="text-xs text-muted-foreground">
            Запрошено {{ inv.invitedAt }} · спливає через {{ inv.expiresIn }}
          </p>
        </div>
        @if (canManageMembers()) {
          <div class="flex gap-1">
            <button
              uiButton
              variant="outline"
              size="sm"
              type="button"
              (click)="resendInvitation.emit(inv.id)"
            >
              <ui-icon name="rotate-cw" />
              Надіслати знову
            </button>
            <button
              uiButton
              variant="ghost"
              size="icon-sm"
              type="button"
              [attr.aria-label]="'Скасувати запрошення ' + inv.email"
              (click)="cancelInvitation.emit(inv.id)"
            >
              <ui-icon name="x" />
            </button>
          </div>
        }
      </li>
    }
  </ul>
</section>
