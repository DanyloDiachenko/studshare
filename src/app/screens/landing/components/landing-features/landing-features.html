<section class="border-y bg-card">
  <div class="mx-auto max-w-6xl px-4 py-20 md:px-8">
    <h2 class="max-w-xl text-balance text-3xl font-semibold tracking-tight">
      Усе необхідне для навчальної групи
    </h2>
    <ul class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (feature of features; track feature.title) {
        <li class="rounded-2xl border bg-background p-6">
          <span class="grid size-11 place-items-center rounded-xl bg-accent text-primary">
            <ui-icon [name]="feature.icon" svgClass="size-5" />
          </span>
          <h3 class="mt-4 text-base font-semibold">{{ feature.title }}</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">
            {{ feature.description }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
