<app-auth-shell
  title="Відновлення пароля"
  subtitle="Вкажіть email — ми надішлемо посилання для створення нового пароля."
>
  <form class="space-y-4" (submit)="onSubmit($event)">
    <div class="grid gap-2">
      <label uiLabel for="email">Email</label>
      <input
        uiInput
        id="email"
        type="email"
        placeholder="name@lpi.edu.ua"
        autocomplete="email"
      />
    </div>
    <button uiButton type="submit" variant="default" size="md" class="w-full">
      Надіслати посилання
    </button>
  </form>
  <a
    class="mt-6 inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground"
    routerLink="/login"
  >
    <ui-icon name="arrow-left" svgClass="size-4" />
    Назад до входу
  </a>
</app-auth-shell>
