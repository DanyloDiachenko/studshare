<app-auth-shell
  title="Відновлення пароля"
  subtitle="Вкажіть email — ми надішлемо код для створення нового пароля."
>
  <form class="space-y-4" (submit)="onSubmit($event)">
    @if (errorMessage()) {
      <p class="rounded-lg border border-destructive/30 bg-destructive/10 px-3 py-2 text-xs text-destructive">
        {{ errorMessage() }}
      </p>
    }
    <div class="grid gap-2">
      <label uiLabel for="email">Email</label>
      <input
        uiInput
        id="email"
        name="email"
        type="email"
        placeholder="name@lpi.edu.ua"
        autocomplete="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>
    @if (codeSent()) {
      <div class="grid gap-2">
        <label uiLabel for="code">Код з листа (6 цифр)</label>
        <input
          uiInput
          id="code"
          name="code"
          placeholder="123456"
          autocomplete="one-time-code"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
        />
      </div>
      <div class="grid gap-2">
        <label uiLabel for="new-password">Новий пароль</label>
        <input
          uiInput
          id="new-password"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
        />
      </div>
    }
    <button
      uiButton
      type="submit"
      variant="default"
      size="md"
      class="w-full"
      [disabled]="isSubmitting()"
    >
      {{ codeSent() ? 'Зберегти новий пароль' : 'Надіслати посилання' }}
    </button>
  </form>
  <a
    class="mt-6 inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground"
    routerLink="/login"
  >
    <ui-icon name="arrow-left" svgClass="size-4" />
    Назад до входу
  </a>
</app-auth-shell>
