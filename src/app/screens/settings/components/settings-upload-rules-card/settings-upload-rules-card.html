<section class="rounded-2xl border bg-card">
  <div class="border-b p-5">
    <h2 class="font-semibold">Правила завантаження</h2>
    <p class="mt-1 text-sm text-muted-foreground">
      Значення за замовчуванням для нових учасників.
    </p>
  </div>
  <div class="space-y-5 p-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <label uiLabel for="s-up">Дозволити студентам завантажувати файли</label>
        <p class="mt-1 text-sm text-muted-foreground">
          Староста може вимкнути це право для окремих людей на сторінці «Учасники».
        </p>
      </div>
      <ui-switch
        inputId="s-up"
        [checked]="settings().allowStudentUploads"
        [disabled]="!canEdit()"
        (checkedChange)="settingsChange.emit({ allowStudentUploads: $event })"
      />
    </div>
    <div class="flex items-start justify-between gap-4">
      <div>
        <label uiLabel for="s-rn">Дозволити студентам перейменовувати власні файли</label>
        <p class="mt-1 text-sm text-muted-foreground">
          Перейменування чужих файлів доступне лише старості.
        </p>
      </div>
      <ui-switch
        inputId="s-rn"
        [checked]="settings().allowStudentRenameOwn"
        [disabled]="!canEdit()"
        (checkedChange)="settingsChange.emit({ allowStudentRenameOwn: $event })"
      />
    </div>
    <div class="grid max-w-xs gap-2">
      <label uiLabel for="s-size">Максимальний розмір файлу, МБ</label>
      <input
        uiInput
        id="s-size"
        type="number"
        [disabled]="!canEdit()"
        [ngModel]="settings().maxFileSizeMb"
        (ngModelChange)="onMaxSizeChange($event)"
      />
    </div>
  </div>
</section>
